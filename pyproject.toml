[project]
name = "replay-optuna"
version = "0.1.0"
description = "HPC PumpAPI Replay Pipeline: Download → Features → Optuna"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "httpx[http2]>=0.28",
    "orjson>=3.11",
    "zstandard>=0.24",
    "polars>=1.32",
    "pyarrow>=21",
    "optuna>=4.5",
    "numpy>=2.3",
    "scikit-learn>=1.7",
    "rich>=14",
    "typer>=0.16",
    "pydantic>=2.11",
    "tenacity>=9",
]

[project.scripts]
replay-optuna = "hpc_replay:app"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]
